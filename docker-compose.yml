# One diffmap for one code host (GitLab or GitHub, set by CODE_HOST in .env):
#   cp .env.example .env      # fill it in (never committed)
#   docker compose up -d --build
#
# Want both GitLab and GitHub? Run a second copy with its own settings file,
# port and project name (its data volume is separate too):
#   DIFFMAP_ENV=.env.github DIFFMAP_PORT=8081 docker compose -p diffmap-github up -d

services:
  diffmap:
    build: .
    image: diffmap:latest
    restart: unless-stopped
    ports:
      - "${DIFFMAP_PORT:-8080}:8080"
    env_file:
      - path: ${DIFFMAP_ENV:-.env}
        required: false
    volumes:
      - diffmap-data:/data
      # If the host uses an internal CA, mount it and set the CA paths in .env:
      # - ./certs:/certs:ro
    # Cap the container's memory: about ANALYSIS_WORKERS x ANALYSIS_MEMORY_MB
    # + 200 MB (defaults: 2 x 2048 MB).
    # mem_limit: 4500m
    # If the code host is on your LAN under a name the container can't resolve:
    # extra_hosts:
    #   - "gitlab.lan:192.168.1.10"

volumes:
  diffmap-data:
